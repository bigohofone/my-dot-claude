<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>figures</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!-- loaded as a script so pdf.js runs on the main thread; the artifact sandbox blocks a CDN worker -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
</head>
<body class="h-screen bg-white text-slate-900 text-sm font-['Inter',sans-serif] md:grid md:grid-cols-[280px_1fr]">
<nav id="list" class="border-b md:border-b-0 md:border-r p-3 space-y-1 overflow-y-auto max-h-[40vh] md:max-h-none"></nav>
<section class="flex flex-col min-w-0 h-full">
  <div class="flex justify-end items-center gap-2 h-14 px-6 border-b">
    <button id="pdf" disabled class="px-3 py-1 border rounded disabled:opacity-40">PDF</button>
    <button id="png" disabled class="px-3 py-1 border rounded disabled:opacity-40">PNG</button>
  </div>
  <main class="flex-1 overflow-auto p-8 grid">
    <canvas id="canvas" class="m-auto"></canvas>
  </main>
  <p id="caption" class="px-6 py-4 border-t leading-relaxed"></p>
</section>
<script id="gallery-data" type="application/json">{"project": "project-name", "figures": []}</script>
<script>
const data = JSON.parse(document.getElementById("gallery-data").textContent);
const figs = data.figures;
const $ = id => document.getElementById(id);
document.title = data.project + "-figures";
let current = 0;

const items = figs.map((f, i) => {
  const b = document.createElement("button");
  b.className = "block w-full text-left px-3 py-2 rounded hover:bg-slate-100";
  b.innerHTML = `<div class="text-xs text-slate-500">Figure ${i + 1}</div><div></div>`;
  b.lastChild.textContent = f.caption_lead;
  b.onclick = () => show(i);
  $("list").appendChild(b);
  return b;
});

async function show(i) {
  current = i;
  const f = figs[i];
  items.forEach((b, j) => b.classList.toggle("bg-blue-50", j === i));
  $("caption").innerHTML = `<b></b> `;
  $("caption").firstChild.textContent = `Figure ${i + 1}: ${f.caption_lead}`;
  $("caption").append(f.caption_body || "");

  // draw the PDF at its printed size (72 pt = 1 in = 96 css px), 2x for sharpness
  const bytes = Uint8Array.from(atob(f.pdf_b64), c => c.charCodeAt(0));
  const page = await (await pdfjsLib.getDocument({ data: bytes }).promise).getPage(1);
  if (current !== i) return;
  const vp = page.getViewport({ scale: 96 / 72 * 2 * devicePixelRatio });
  const canvas = $("canvas");
  canvas.width = vp.width;
  canvas.height = vp.height;
  canvas.style.width = vp.width / 2 / devicePixelRatio + "px";
  page.render({ canvasContext: canvas.getContext("2d"), viewport: vp });
}
if (figs.length) show(0);

document.addEventListener("keydown", e => {
  const step = { ArrowDown: 1, ArrowUp: -1 }[e.key];
  if (!step || !figs.length) return;
  e.preventDefault();
  const i = Math.min(figs.length - 1, Math.max(0, current + step));
  show(i);
  items[i].scrollIntoView({ block: "nearest" });
});

let downloads = null;
function save(ext) {
  const f = figs[current];
  const bytes = Uint8Array.from(atob(f[ext + "_b64"]), c => c.charCodeAt(0));
  downloads.save({ filename: `${f.id}.${ext}`, data: new Blob([bytes]) }).catch(() => {});
}
$("pdf").onclick = () => save("pdf");
$("png").onclick = () => save("png");
(window.claude ? window.claude.use("downloads") : Promise.resolve(null)).then(ns => {
  downloads = ns;
  if (ns && figs.length) $("pdf").disabled = $("png").disabled = false;
});
</script>
</body>
</html>
